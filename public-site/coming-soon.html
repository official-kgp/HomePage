<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f4f5ef">
  <title>Coming Soon | かざま隊の集いの場</title>
  <style>
    :root{color-scheme:light;--ink:#172b2d;--muted:#64716a;--green:#477b57;--paper:#f4f5ef;--line:#d9dfd6}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
    main{width:min(100%,720px);padding:clamp(28px,7vw,68px);border:1px solid var(--line);background:#fff;box-shadow:0 24px 70px #172b2d0c}
    .mark{display:inline-grid;place-items:center;width:46px;height:46px;margin-bottom:34px;border-radius:50%;background:#e7efe4;color:var(--green);font-size:23px}
    .eyebrow{margin:0 0 14px;color:var(--green);font-size:11px;font-weight:700;letter-spacing:.2em}
    h1{margin:0;font-size:clamp(42px,9vw,72px);font-weight:600;letter-spacing:-.055em;line-height:1.05}
    .jp{margin:20px 0 0;font-size:19px;font-weight:600}
    .description{max-width:440px;margin:12px 0 0;color:var(--muted);font-size:14px;line-height:2}
    .rule{width:56px;height:2px;margin:34px 0 18px;background:var(--green)}
    footer{color:var(--muted);font-size:11px;letter-spacing:.04em}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">風</div>
    <p class="eyebrow">KAZAMATAI COMMUNITY</p>
    <h1>Coming<br>Soon.</h1>
    <p class="jp">かざま隊の集いの場</p>
    <p class="description">公式サイトは現在準備中です。公開まで、もうしばらくお待ちください。</p>
    <div class="rule"></div>
    <footer>© 2025–2026 かざま隊の集いの場</footer>
  </main>
</body>
</html>
